<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Undangan - No Login</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Dashboard Undangan">
    <meta name="theme-color" content="#f8f9fa">
    <meta name="color-scheme" content="dark light">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Preconnect CDN -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">

    <!-- Preload Resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Josefin+Sans&display=swap" as="style">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css" integrity="sha256-WAgYcAck1C1/zEl5sBl5cfyhxtLgKGdpI3oKyJffVRI=" crossorigin="anonymous" as="style">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" integrity="sha256-oxqX0LQclbvrsJt8IymkxnISn4Np2Wy2rY9jjoQlDEg=" crossorigin="anonymous" as="style">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha256-dABdfBfUoC8vJUBOwGVdm8L9qlMWaHTIfXt+7GnZCIo=" crossorigin="anonymous" as="style">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha256-y3ibfOyBqlgBd+GzwFYQEVOZdNJD06HeDXihongBXKs=" crossorigin="anonymous" as="script">

    <!-- Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans&display=swap">

    <!-- Dependencies CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css" integrity="sha256-WAgYcAck1C1/zEl5sBl5cfyhxtLgKGdpI3oKyJffVRI=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" integrity="sha256-oxqX0LQclbvrsJt8IymkxnISn4Np2Wy2rY9jjoQlDEg=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha256-dABdfBfUoC8vJUBOwGVdm8L9qlMWaHTIfXt+7GnZCIo=" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/admin.css">

    <!-- Dependencies JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha256-y3ibfOyBqlgBd+GzwFYQEVOZdNJD06HeDXihongBXKs=" crossorigin="anonymous"></script>
    <script src="./dist/admin.js"></script>
</head>

<body data-url="https://api.ulems.my.id/">

    <!-- Nav bottom -->
    <nav class="navbar navbar-expand fixed-bottom rounded-top-4 border-top d-md-none d-lg-none d-xl-none p-0">
        <ul class="navbar-nav nav-justified w-100 align-items-center">
            <li class="nav-item">
                <button class="nav-link active" onclick="showTab('home')">
                    <i class="fa-solid fa-house"></i>
                    <span class="d-block" style="font-size: 0.7rem;">Home</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="showTab('setting')">
                    <i class="fa-solid fa-gear"></i>
                    <span class="d-block" style="font-size: 0.7rem;">Setting</span>
                </button>
            </li>
        </ul>
    </nav>

    <!-- Main -->
    <main class="container mt-4 mb-5">

        <div class="d-none d-sm-flex justify-content-between align-items-center mt-4 mb-5 pt-1">
            <h4 class="m-0 p-0 flex-grow-1 fw-bold">Undangan<i class="fa-solid fa-fire text-danger ms-2"></i></h4>
            <div id="dashboard-name" style="font-size: 1.4rem;">
                <!-- Contoh nama dashboard statis -->
                User Dashboard
            </div>
        </div>

        <div class="row m-0 p-0">

            <div class="col-md-3 d-none d-md-block m-0 p-0">
                <ul class="nav flex-column w-100 nav-pills pe-4" role="tablist">
                    <li class="nav-item pe-2" role="presentation">
                        <button class="btn-theme-auto nav-link w-100 text-start fw-semibold mb-1 rounded-4 shadow-sm active" id="button-home" type="button" role="tab" aria-controls="pills-home" aria-selected="true" onclick="showTab('home')">
                            <i class="fa-solid fa-house ms-3 me-2"></i>Home
                        </button>
                    </li>
                    <li class="nav-item pe-2" role="presentation">
                        <button class="btn-theme-auto nav-link w-100 text-start fw-semibold my-1 rounded-4 shadow-sm" id="button-setting" type="button" role="tab" aria-controls="pills-setting" aria-selected="false" onclick="showTab('setting')">
                            <i class="fa-solid fa-gear ms-3 me-2"></i>Setting
                        </button>
                    </li>
                </ul>
            </div>

            <div class="col-md-9 m-0 p-0">
                <div class="tab-content">
                    <section class="tab-pane fade show active" id="pills-home" role="tabpanel" tabindex="0">
                        <div class="rounded-4 p-2 mb-4 shadow" style="background-color: var(--bs-gray-200)">
                            <div class="d-flex justify-content-between">
                                <h5 class="fw-bold my-1 ms-0 p-0" style="color: var(--bs-gray-900); font-size: 1rem;">
                                    <i class="fa-solid fa-home mx-2"></i>Home
                                </h5>
                                <div class="d-flex">
                                    <button class="btn btn-success rounded-3 btn-sm shadow-sm my-0 ms-0 me-2 pb-0" aria-label="Download comment">
                                        <i class="fa-solid fa-download"></i><span class="d-none d-sm-inline ms-2">Download</span>
                                    </button>
                                    <button class="btn btn-secondary rounded-3 btn-sm shadow-sm m-0 pb-0" aria-label="Change theme">
                                        <i class="fa-solid fa-circle-half-stroke"></i><span class="d-none d-sm-inline ms-2">Theme</span>
                                    </button>
                                </div>
                            </div>
                            <p>Ini adalah konten Home Dashboard tanpa login.</p>
                        </div>
                        <div id="list-undangan"></div>
                    </section>

                    <section class="tab-pane fade" id="pills-setting" role="tabpanel" tabindex="0">
                        <div class="rounded-4 p-2 mb-4 shadow" style="background-color: var(--bs-gray-200)">
                            <h5 class="fw-bold my-1 ms-0 p-0" style="color: var(--bs-gray-900); font-size: 1rem;">
                                <i class="fa-solid fa-gear mx-2"></i>Setting
                            </h5>
                            <p>Pengaturan dashboard dapat diakses langsung tanpa login.</p>
                        </div>
                    </section>
                </div>
            </div>

        </div>
    </main>

    <script>
        function showTab(tabName) {
            const homeTab = document.getElementById('pills-home');
            const settingTab = document.getElementById('pills-setting');
            const btnHome = document.getElementById('button-home');
            const btnSetting = document.getElementById('button-setting');

            if (tabName === 'home') {
                homeTab.classList.add('show', 'active');
                settingTab.classList.remove('show', 'active');
                btnHome.classList.add('active');
                btnSetting.classList.remove('active');
            } else if (tabName === 'setting') {
                settingTab.classList.add('show', 'active');
                homeTab.classList.remove('show', 'active');
                btnSetting.classList.add('active');
                btnHome.classList.remove('active');
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>

</html>
